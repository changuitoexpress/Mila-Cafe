<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f0e6" />
  <title>Mila Café — Panel de caja</title>
  <link rel="icon" type="image/svg+xml" href="icons/mila-icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .caja-wrap { max-width: 460px; margin: 40px auto; padding: 0 20px; }
    .caja-card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; text-align: center; }
    .caja-result { margin-top: 18px; border-radius: var(--radius-sm); padding: 16px; font-size: 14px; text-align: left; white-space: pre-line; }
    .caja-result.ok { background: #EAF1E4; color: var(--sage); }
    .caja-result.err { background: #F6E3E1; color: var(--danger); }
    .caja-result.pending { background: #f6f0e6; color: #5d5149; }
    .caja-help { color: #6b625c; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="caja-wrap">
    <section class="caja-card" aria-labelledby="caja-title">
      <p class="eyebrow">Mila Café</p>
      <h1 id="caja-title" class="logo" style="font-size:24px;">Panel de caja</h1>
      <p class="caja-help">Escanea el QR con el lector (que escribe el código y termina con Enter) o pega el código del ticket.</p>

      <label class="field-label" for="token-input">Código del ticket</label>
      <input id="token-input" class="input" type="text" placeholder="Escanea aquí o pega el código" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="caja-help" />
      <span id="caja-help" class="caja-help">El lector debe estar conectado y el cursor en este campo.</span>

      <button id="btn-validate" class="btn btn-primary btn-block" type="button" style="margin-top:16px;">Validar ticket</button>
      <div id="result" class="caja-result hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    (() => {
      const SUPABASE_URL = "https://jspmxmaeaswnumxyetcu.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_M_cDBeTCWqnii7cvT0y6bQ_C4lsVijO";
      const supabaseCashierClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const input = document.getElementById("token-input");
      const button = document.getElementById("btn-validate");
      const resultEl = document.getElementById("result");
      let isValidating = false;

      function showResult(message, state) {
        resultEl.classList.remove("hidden", "ok", "err", "pending");
        resultEl.classList.add(state);
        resultEl.textContent = message;
      }

      function formatSuccess(data) {
        const lines = [`✔ ${data.message || "Pedido validado correctamente."}`];
        if (data.cliente) lines.push(`Cliente: ${data.cliente}`);
        if (data.total != null) lines.push(`Total: $${Number(data.total).toFixed(2)}`);
        if (data.cashback_abonado != null) {
          lines.push(`Cashback abonado: $${Number(data.cashback_abonado).toFixed(2)}`);
        }
        return lines.join("\n");
      }

      async function validateTicket() {
        if (isValidating) return;
        const token = input.value.trim();
        if (!token) {
          showResult("Escanea o escribe el código del ticket.", "err");
          input.focus();
          return;
        }

        isValidating = true;
        button.disabled = true;
        button.textContent = "Validando…";
        showResult("Consultando el ticket…", "pending");

        try {
          const { data, error } = await supabaseCashierClient.rpc("redeem_order", {
            p_qr_token: token,
          });
          const response = Array.isArray(data) ? data[0] : data;

          if (error) {
            console.error("No se pudo validar el ticket:", error);
            showResult(`No se pudo validar el ticket: ${error.message || "error de conexión con Supabase"}.`, "err");
          } else if (!response || response.success !== true) {
            showResult(response?.message || "Supabase no confirmó la validación del ticket.", "err");
          } else {
            showResult(formatSuccess(response), "ok");
          }
        } catch (error) {
          console.error("Error al validar el ticket:", error);
          showResult(`No se pudo validar el ticket: ${error.message || "error inesperado"}.`, "err");
        } finally {
          input.value = "";
          isValidating = false;
          button.disabled = false;
          button.textContent = "Validar ticket";
          input.focus();
        }
      }

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          validateTicket();
        }
      });
      button.addEventListener("click", validateTicket);
      input.focus();
    })();
  </script>
</body>
</html>
